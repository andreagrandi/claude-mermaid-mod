# Creates the GitHub release for a version bump that has none yet. The release
# steps in AGENTS.md write the notes by hand; this catches a bump without them.
name: Release

on:
  push:
    branches: [master]
    paths: [.claude-plugin/plugin.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the release if the version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$version" --generate-notes
